[project]
name = "plasticity-foundation"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0",
    "autoreject>=0.4.3",
    "blobfile>=3.1.0",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "ipywidgets>=8.1.8",
    "mne>=1.11.0",
    "mne-icalabel>=0.9.0",
    "moviepy>=1.0.3",
    "mypy>=1.19.1",
    "notebook>=7.5.5",
    "numpy < 2",
    "opencv-python>=4.11.0.86",
    "pandas>=1.5.3",
    "pillow>=12.1.1",
    "pyhealth==1.1.4",
    "pyrealsense2>=2.58.1.10581",
    "pytest>=9.0.2",
    "pywavelets>=1.8.0",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "tensorboardx>=2.6.4",
    "timm==0.4.12",
    "torch==2.0.1",
    "torchaudio==2.0.2",
    "torchvision==0.15.2",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
